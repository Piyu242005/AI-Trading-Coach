name: CI

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r frontend-streamlit/requirements.txt

      - name: Lint changed Streamlit analytics modules
        run: |
          ruff check frontend-streamlit/analytics.py frontend-streamlit/training/train_model.py tests/test_streamlit_analytics.py

      - name: Run tests
        run: pytest
